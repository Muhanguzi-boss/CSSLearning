
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Example</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <header class="bg-blue-500 text-white text-center py-4">
    <h1 class="text-3xl font-bold">Welcome to My Website</h1>
  </header>
  <section class="container mx-auto mt-8">
    <div class="flex justify-center">
      <img 
        src="https://images.pexels.com/photos/1108099/pexels-photo-1108099.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940" 
        alt="Beautiful Landscape" 
        class="rounded-lg shadow-lg w-full max-w-md"
      >
    </div>
  </section>

</body>
</html>
